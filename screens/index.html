<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>온라인 멘토링 화면 둘러보기 | K예술영재</title>
<style>
  :root { --bg: #000; --c1: #161617; --c2: #1D1D1F; --line: rgba(255,255,255,.12); --t1: #F5F5F7; --t2: #A1A1A6; --t3: #6E6E73;
    --blue: #2997FF; --pur: #A970FF; --ease: cubic-bezier(.28,.11,.32,1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--t1); font: 15px/1.6 "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    letter-spacing: -.01em; word-break: keep-all; overflow-wrap: break-word; }
  button { font: inherit; letter-spacing: inherit; cursor: pointer; }
  .wrap { max-width: 1320px; margin: 0 auto; padding: 0 28px 64px; }

  header { display: flex; align-items: center; gap: 14px; padding: 26px 0 20px; flex-wrap: wrap; }
  .mark { width: 40px; height: 40px; border-radius: 11px; background: linear-gradient(135deg, var(--blue), var(--pur) 60%, #FF6482); display: grid; place-items: center; font-weight: 800; font-size: 18px; flex: none; }
  header h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.025em; }
  header p { margin: 2px 0 0; color: var(--t2); font-size: 13.5px; }
  .grow { flex: 1; }
  .fpill { position: relative; display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 980px; background: var(--c2); border: 1px solid var(--line); min-width: 200px; }
  .fpill::before { content: ""; position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 980px; background: linear-gradient(100deg, var(--blue), var(--pur)); transition: transform .4s var(--ease); }
  body.fa .fpill::before { transform: translateX(100%); }
  .fpill button { position: relative; border: 0; background: none; color: rgba(235,235,245,.6); padding: 8px 18px; border-radius: 980px; font-weight: 600; transition: color .3s; }
  .fpill button[aria-pressed="true"] { color: #fff; }

  .roles { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 22px; }
  .roles button { border: 1px solid var(--line); background: transparent; color: var(--t2); border-radius: 980px; padding: 9px 18px; font-weight: 600; font-size: 14.5px; transition: background .2s, color .2s; }
  .roles button:hover { color: var(--t1); }
  .roles button[aria-pressed="true"] { background: var(--t1); color: #1D1D1F; border-color: var(--t1); }

  .main { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 28px; align-items: start; }
  .steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; position: sticky; top: 16px; }
  .steps button { width: 100%; text-align: left; display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; border: 0; background: transparent; color: var(--t2);
    padding: 11px 12px; border-radius: 14px; transition: background .2s, color .2s; }
  .steps button:hover { background: var(--c1); color: var(--t1); }
  .steps button[aria-current="true"] { background: var(--c2); color: var(--t1); }
  .steps i { font-style: normal; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; border: 1px solid var(--line); color: var(--t3); margin-top: 1px; }
  .steps button[aria-current="true"] i { background: var(--blue); border-color: var(--blue); color: #fff; }
  .steps b { display: block; font-weight: 600; font-size: 14.5px; }
  .steps small { display: block; font-size: 12.5px; color: var(--t3); margin-top: 2px; }
  .steps .soon { padding: 14px; color: var(--t3); font-size: 13.5px; border: 1px dashed var(--line); border-radius: 14px; }

  .view { min-width: 0; }
  .stage { display: grid; place-items: center; background: radial-gradient(120% 90% at 50% 0%, #1b1b1e 0%, #0b0b0c 70%); border: 1px solid var(--line); border-radius: 26px; padding: 34px 28px; min-height: 420px; }
  /* 휴대폰 틀 */
  .phone { width: min(330px, 78vw); border-radius: 46px; padding: 38px 12px 16px; background: #2a2a2d; box-shadow: inset 0 0 0 1.5px #3a3a3e, 0 40px 80px -30px rgba(0,0,0,.9); position: relative; }
  .phone::before { content: ""; position: absolute; top: 13px; left: 50%; transform: translateX(-50%); width: 76px; height: 14px; border-radius: 980px; background: #000; z-index: 1; }
  .phone img { display: block; width: 100%; border-radius: 10px 10px 30px 30px; }
  /* 노트북 화면 틀 */
  .laptop { width: 100%; }
  .laptop .scr { border-radius: 16px 16px 4px 4px; padding: 10px 10px 12px; background: #2a2a2d; box-shadow: inset 0 0 0 1.5px #3a3a3e; }
  .laptop .scr img { display: block; width: 100%; border-radius: 6px; }
  .laptop .base { height: 14px; margin: 0 -3%; border-radius: 0 0 14px 14px; background: linear-gradient(#3a3a3e, #232326); box-shadow: 0 30px 60px -24px rgba(0,0,0,.9); }
  /* 녹화 파일 */
  .rec { width: 100%; position: relative; }

  .rec .tag { position: absolute; left: 14px; bottom: 14px; display: inline-flex; align-items: center; gap: 7px; padding: 5px 12px; border-radius: 980px; background: rgba(0,0,0,.66); font-size: 12.5px; font-weight: 600; }
  .rec .tag::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #FF453A; }
  .stage a { display: block; cursor: zoom-in; }
  .stage a:focus-visible { outline: 2px solid var(--blue); outline-offset: 6px; border-radius: 12px; }

  .cap { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: start; padding: 22px 6px 0; }
  .cap h2 { margin: 0 0 6px; font-size: 21px; font-weight: 700; letter-spacing: -.02em; }
  .cap ul { margin: 0; padding-left: 18px; color: var(--t2); }
  .cap li + li { margin-top: 4px; }
  .nav { display: flex; gap: 8px; }
  .nav button { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--c2); color: var(--t1); display: grid; place-items: center; }
  .nav button:disabled { opacity: .3; cursor: default; }
  .nav svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
  button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  footer { margin-top: 40px; color: var(--t3); font-size: 12.5px; }

  @media (max-width: 860px) {
    .wrap { padding: 0 16px 48px; }
    .main { grid-template-columns: 1fr; }
    .steps { position: static; grid-auto-flow: column; grid-auto-columns: minmax(170px, 1fr); overflow-x: auto; padding-bottom: 4px; }
    .stage { padding: 20px 12px; border-radius: 20px; min-height: 0; }
    .cap { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>

    $('#ttl').textContent = it.t;
    $('#desc').innerHTML = it.d.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('');
    $('#prev').disabled = S.i === 0; $('#next').disabled = S.i >= R.items.length - 1;
    try { history.replaceState(null, '', '#' + S.f + '-' + S.r + '-' + (S.i + 1)); } catch (e) {}
  }
  document.querySelectorAll('.fpill button').forEach(function (b) { b.onclick = function () { if (S.f !== b.dataset.f) { S.f = b.dataset.f; S.i = 0; paint(); } }; });
  $('#roles').onclick = function (e) { var b = e.target.closest('[data-r]'); if (b) { S.r = b.dataset.r; S.i = 0; paint(); } };
  $('#steps').onclick = function (e) { var b = e.target.closest('[data-i]'); if (b) { S.i = Number(b.dataset.i); paint(); } };
  $('#prev').onclick = function () { if (S.i > 0) { S.i--; paint(); } };
  $('#next').onclick = function () { if (S.i < role().items.length - 1) { S.i++; paint(); } };
  addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') $('#prev').click();
    else if (e.key === 'ArrowRight') $('#next').click();
  });
  paint();
})();
</script>
</body>
</html>
