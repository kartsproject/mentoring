<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#202226">
<title>K예술영재 온라인 멘토링</title>
<script>
  // 예전 주소(회차가 붙은 학생 주소)는 무용(b)으로 이어 줌
  if (/[?&]r=/.test(location.search)) location.replace('b/' + location.search);
</script>
<link rel="stylesheet" href="b/style.css">
<style>
  body { background: var(--band); color: var(--band-tx); min-height: 100%; display: flex; flex-direction: column; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 40px 20px; flex: 1; width: 100%; }
  .hb { display: flex; align-items: center; gap: 11px; margin-bottom: 34px; }
  .hb small { display: block; font-size: 12px; color: var(--band-soft); font-weight: 600; }
  .hb b { display: block; font-size: 15px; font-weight: 800; }
  h1 { font-size: clamp(28px, 6vw, 38px); margin: 0 0 8px; letter-spacing: -.035em; }
  h1 em { font-style: normal; color: var(--yel); }
  p.lead { color: var(--band-soft); margin: 0 0 28px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .fc { position: relative; display: block; background: var(--paper); color: var(--ink); text-decoration: none; border-radius: 18px; padding: 24px 22px 22px; overflow: hidden; transition: transform .12s; }
  .fc:hover { transform: translateY(-2px); }
  .fc::before { content: ""; position: absolute; left: 0; top: 0; right: 0; height: 6px; background: var(--c); }
  .fc small { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--gray); }
  .fc small i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .fc b { display: block; font-size: 22px; font-weight: 800; letter-spacing: -.02em; margin: 8px 0 6px; }
  .fc span { font-size: 14px; color: var(--gray); line-height: 1.55; }
  .fc .go { display: inline-flex; margin-top: 16px; font-weight: 800; font-size: 14px; background: var(--ink); color: #fff; border-radius: 9px; padding: 8px 14px; }
  .fc.off { opacity: .55; pointer-events: none; }
  footer { text-align: center; font-size: 12.5px; color: var(--band-soft); padding: 0 20px 30px; }
  @media (max-width: 560px) { .cards { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="kstrip" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
<main class="wrap">
  <div class="hb"><span class="kmark" aria-hidden="true"><b>K</b><span><i></i><i></i><i></i><i></i></span></span><div><small>2026 K예술영재 프로젝트</small><b>심화과정 · 온라인 멘토링</b></div></div>
  <h1>온라인 멘토링 <em>입장</em></h1>
  <p class="lead">참여하는 분야를 골라 주세요.</p>
  <div class="cards">
    <a class="fc" href="b/" style="--c: var(--dance)"><small><i></i>무용</small><b>무용 심화 멘토링</b><span>멘토와 1:1 · 대기실에서 차례를 기다려 입장합니다.</span><div class="go">입장하기</div></a>
    <a class="fc" href="a/" style="--c: var(--art)" id="artCard"><small><i></i>미술</small><b>미술 심화 멘토링</b><span>멘토 여러 명과 함께 · 전체 멘토링과 조별 그룹 멘토링으로 진행합니다.</span><div class="go">입장하기</div></a>
  </div>
</main>
<footer>한국예술영재교육연구원 · 2026 K예술영재 프로젝트</footer>
</body>
</html>
